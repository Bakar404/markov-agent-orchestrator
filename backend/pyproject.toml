[project]
name = "markov-agent-orchestrator-backend"
version = "0.1.0"
description = "Stochastic multi-agent orchestration engine with a research intelligence layer"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
